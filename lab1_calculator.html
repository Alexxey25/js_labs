<!DOCTYPE html>
<html>

<head>
  <title>Калькулятор</title>
  <link rel="stylesheet" href="lab1_style.css">
  <script type="text/JavaScript" src="script.js"></script>
</head>

<body>

  <div class="central"> <!-- div - это базовый html-контейнер, который может содержать в себе другие html-элементы. -->

    <!-- блок с экраном калькулятора, где будет выводиться результат вычислений. -->
    <div id="result" class="result">
      0
    </div>

    <!-- блок с кнопками калькулятора. -->
    <div>
      <!--горизонтальный ряд из четырех кнопок-->
      <div>  
        <button id="btn_op_clear" class="my-btn primary">C</button>    <!-- про тэг кнопки: https://www.w3schools.com/tags/tag_button.asp -->
        <button id="btn_op_sign" class="my-btn primary">+/-</button>
        <button id="btn_op_percent" class="my-btn primary">%</button>
        <button id="btn_op_div" class="my-btn primary">/</button>
      </div>

      <div>
        <button id="btn_digit_7" class="my-btn">7</button>
        <button id="btn_digit_8" class="my-btn">8</button>
        <button id="btn_digit_9" class="my-btn">9</button>
        <button id="btn_op_mult" class="my-btn primary">x</button>
      </div>

      <div>
        <button id="btn_digit_4" class="my-btn">4</button>
        <button id="btn_digit_5" class="my-btn">5</button>
        <button id="btn_digit_6" class="my-btn">6</button>
        <button id="btn_op_minus" class="my-btn primary">-</button>
      </div>

      <div>
        <button id="btn_digit_1" class="my-btn">1</button>
        <button id="btn_digit_2" class="my-btn">2</button>
        <button id="btn_digit_3" class="my-btn">3</button>
        <button id="btn_op_plus" class="my-btn primary">+</button>
      </div>

      <div>
        <button id="btn_digit_0" class="my-btn">0</button>
        <button id="btn_digit_dot" class="my-btn">.</button>
        <button id="btn_op_equal" class="my-btn execute">=</button>
      </div>

      <div>
        <button id="btn_del" class="my-btn primary">del</button>
        <button id="btn_back" class="my-btn primary">back</button>
        <button id="btn_sqrt" class="my-btn primary">sqrt</button>
        <button id="btn_x^2" class="my-btn primary">x^2</button>
      </div>

      <div>
        <button id="btn_fact" class="my-btn primary">x!</button>
        <button id="btn_000" class="my-btn primary">000</button>
        <button id="btn_+eq" class="my-btn primary">+=</button>
        <button id="btn_-eq" class="my-btn primary">-=</button>
      </div>

      <div>
        <button id="btn_resChange" class="my-btn primary">res</button>
        <button id="btn_asin" class="my-btn primary">asin</button>
      </div>
  </div>
  
</body>
</html>
